
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Royale</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #101820;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 5;
  background: rgba(12,20,25,.85);
  padding: 14px 18px;
  border: 1px solid #52636a;
  border-radius: 10px;
  min-width: 190px;
}

#hud h2 {
  margin: 0 0 10px;
  color: #71e69a;
}

.stat {
  margin: 6px 0;
  font-size: 14px;
}

#controls {
  position: fixed;
  bottom: 15px;
  left: 15px;
  background: rgba(12,20,25,.8);
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
}

#location {
  position: fixed;
  top: 15px;
  right: 15px;
  background: rgba(12,20,25,.85);
  padding: 12px 18px;
  border-radius: 8px;
}

#status {
  position: fixed;
  top: 85px;
  right: 15px;
  background: rgba(12,20,25,.85);
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
}
</style>
</head>

<body>

<div id="hud">
  <h2>ULTIMATE ROYALE</h2>
  <div class="stat">Players: <span id="players">50</span>/50</div>
  <div class="stat">Mode: Solo</div>
  <div class="stat">Health: <span id="health">100</span></div>
  <div class="stat">Shield: 0</div>
  <div class="stat">Eliminations: 0</div>
  <div class="stat">Version: 0.1</div>
</div>

<div id="location">Location: <span id="poi">Island</span></div>

<div id="status">Match initializing...</div>

<div id="controls">
  <b>CONTROLS</b><br>
  W A S D - Move<br>
  SHIFT - Sprint
</div>

<canvas id="game"></canvas>

<script>

// ==========================================
// ULTIMATE ROYALE
// VERSION 0.1
// ==========================================

// CANVAS

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

// WORLD

const world = {
  width: 2600,
  height: 2200
};

// CAMERA

const camera = {
  x: 0,
  y: 0
};

// INPUT

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (["w","a","s","d"," "].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

// RANDOM

function random(min, max) {
  return Math.random() * (max - min) + min;
}

// PLAYER

const player = {
  x: 1300,
  y: 1100,
  radius: 15,
  speed: 230,
  color: "#35a9ff",
  health: 100
};

// MAP OBJECTS

const buildings = [];
const trees = [];
const roads = [];
const pois = [];

function addBuilding(x, y, w, h, color) {
  buildings.push({x,y,w,h,color});
}

function addTree(x, y) {
  trees.push({x,y,r:random(10,17)});
}

// ROADS

roads.push({
  x: 0,
  y: 1070,
  w: 2600,
  h: 75
});

roads.push({
  x: 1260,
  y: 0,
  w: 75,
  h: 2200
});

// POI LOCATIONS

const locations = [
  {name:"Downtown",x:450,y:450},
  {name:"Military Base",x:2050,y:400},
  {name:"Airport",x:1950,y:1700},
  {name:"Harbor",x:400,y:1700},
  {name:"Power Plant",x:1300,y:350},
  {name:"Suburbs",x:650,y:1200},
  {name:"Research Facility",x:2100,y:1100},
  {name:"Shopping Mall",x:1150,y:1750}
];

locations.forEach((poi, index) => {

  pois.push(poi);

  const color = [
    "#89949b",
    "#657b8c",
    "#b3a28a",
    "#779c9a"
  ][index % 4];

  for (let i = 0; i < 7; i++) {

    addBuilding(
      poi.x + random(-110,110),
      poi.y + random(-90,90),
      random(45,85),
      random(40,75),
      color
    );

  }

});

// EXTRA BUILDINGS

for (let i = 0; i < 65; i++) {

  addBuilding(
    random(80, world.width-130),
    random(80, world.height-130),
    random(35,75),
    random(35,75),
    "#9b9b91"
  );

}

// TREES

for (let i = 0; i < 550; i++) {

  addTree(
    random(20, world.width-20),
    random(20, world.height-20)
  );

}

// ==========================================
// AI BOT SYSTEM
// ==========================================

const bots = [];

const botNames = [
  "Shadow","Raptor","Falcon","Blaze",
  "Ghost","Hunter","Storm","Viper",
  "Ace","Ranger","Nova","Titan"
];

for (let i = 0; i < 49; i++) {

  bots.push({

    id: i+1,

    name: botNames[i % botNames.length] + "_" + (i+1),

    x: random(100,2500),
    y: random(100,2100),

    radius: 13,

    speed: random(65,105),

    direction: random(0,Math.PI*2),

    timer: random(1,4),

    color: "#e75b59",

    alive: true,

    team: 0,

    state: "Wandering"

  });

}

// ==========================================
// COLLISION
// ==========================================

function overlapsBuilding(x,y,r) {

  for (const b of buildings) {

    const closestX = Math.max(b.x, Math.min(x,b.x+b.w));
    const closestY = Math.max(b.y, Math.min(y,b.y+b.h));

    const dx = x-closestX;
    const dy = y-closestY;

    if (dx*dx+dy*dy < r*r) {
      return true;
    }

  }

  return false;

}

// ==========================================
// PLAYER UPDATE
// ==========================================

function updatePlayer(dt) {

  let dx = 0;
  let dy = 0;

  if (keys["w"]) dy--;
  if (keys["s"]) dy++;
  if (keys["a"]) dx--;
  if (keys["d"]) dx++;

  const length = Math.hypot(dx,dy);

  if (length > 0) {

    dx /= length;
    dy /= length;

  }

  const sprint = keys["shift"] ? 1.5 : 1;

  const speed = player.speed * sprint;

  const nextX = player.x + dx*speed*dt;
  const nextY = player.y + dy*speed*dt;

  if (
    nextX > player.radius &&
    nextX < world.width-player.radius &&
    !overlapsBuilding(nextX,player.y,player.radius)
  ) {
    player.x = nextX;
  }

  if (
    nextY > player.radius &&
    nextY < world.height-player.radius &&
    !overlapsBuilding(player.x,nextY,player.radius)
  ) {
    player.y = nextY;
  }

}

// ==========================================
// AI UPDATE
// ==========================================

function updateBots(dt) {

  for (const bot of bots) {

    if (!bot.alive) continue;

    bot.timer -= dt;

    if (bot.timer <= 0) {

      bot.direction = random(0,Math.PI*2);

      bot.timer = random(1.5,4);

    }

    const nextX =
      bot.x + Math.cos(bot.direction)*bot.speed*dt;

    const nextY =
      bot.y + Math.sin(bot.direction)*bot.speed*dt;

    if (
      nextX > 15 &&
      nextX < world.width-15 &&
      !overlapsBuilding(nextX,bot.y,bot.radius)
    ) {

      bot.x = nextX;

    } else {

      bot.direction = random(0,Math.PI*2);

    }

    if (
      nextY > 15 &&
      nextY < world.height-15 &&
      !overlapsBuilding(bot.x,nextY,bot.radius)
    ) {

      bot.y = nextY;

    }

  }

}

// ==========================================
// CAMERA UPDATE
// ==========================================

function updateCamera() {

  camera.x = player.x-canvas.width/2;
  camera.y = player.y-canvas.height/2;

  camera.x = Math.max(
    0,
    Math.min(camera.x,world.width-canvas.width)
  );

  camera.y = Math.max(
    0,
    Math.min(camera.y,world.height-canvas.height)
  );

}

// ==========================================
// DRAW WORLD
// ==========================================

function drawWorld() {

  ctx.fillStyle = "#568d49";
  ctx.fillRect(0,0,world.width,world.height);

  // GRASS DETAILS

  ctx.fillStyle = "rgba(30,80,35,0.12)";

  for (let x=0;x<world.width;x+=90) {
    for (let y=0;y<world.height;y+=90) {

      ctx.fillRect(x+10,y+10,3,3);

    }
  }

  // ROADS

  for (const road of roads) {

    ctx.fillStyle = "#555a5d";

    ctx.fillRect(
      road.x,road.y,road.w,road.h
    );

    ctx.strokeStyle = "#d5c98c";
    ctx.setLineDash([20,20]);
    ctx.lineWidth = 3;

    ctx.beginPath();

    if (road.w > road.h) {

      ctx.moveTo(road.x,road.y+road.h/2);
      ctx.lineTo(road.x+road.w,road.y+road.h/2);

    } else {

      ctx.moveTo(road.x+road.w/2,road.y);
      ctx.lineTo(road.x+road.w/2,road.y+road.h);

    }

    ctx.stroke();
    ctx.setLineDash([]);

  }

  // POI LABELS

  for (const poi of pois) {

    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.font = "bold 23px Arial";
    ctx.textAlign = "center";

    ctx.fillText(poi.name,poi.x,poi.y-125);

  }

  // BUILDINGS

  for (const b of buildings) {

    ctx.fillStyle = "#343b40";
    ctx.fillRect(b.x+5,b.y+6,b.w,b.h);

    ctx.fillStyle = b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h);

    ctx.fillStyle = "#59666d";
    ctx.fillRect(b.x+5,b.y+5,b.w-10,7);

    ctx.strokeStyle = "#343d40";
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x,b.y,b.w,b.h);

    // ROOF DETAIL

    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.fillRect(b.x+10,b.y+17,b.w-20,4);

  }

  // TREES

  for (const tree of trees) {

    ctx.fillStyle = "#57412c";

    ctx.fillRect(
      tree.x-3,tree.y,6,tree.r
    );

    ctx.fillStyle = "#286b37";

    ctx.beginPath();
    ctx.arc(tree.x,tree.y,tree.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#438a45";

    ctx.beginPath();
    ctx.arc(
      tree.x-4,tree.y-4,
      tree.r*0.65,0,Math.PI*2
    );
    ctx.fill();

  }

}

// ==========================================
// DRAW CHARACTERS
// ==========================================

function drawCharacter(character,isPlayer=false) {

  ctx.fillStyle = "rgba(0,0,0,0.3)";

  ctx.beginPath();
  ctx.ellipse(
    character.x+3,
    character.y+7,
    character.radius,
    character.radius*0.7,
    0,0,Math.PI*2
  );
  ctx.fill();

  ctx.fillStyle = character.color;

  ctx.beginPath();
  ctx.arc(
    character.x,
    character.y,
    character.radius,
    0,Math.PI*2
  );
  ctx.fill();

  ctx.strokeStyle = isPlayer ? "#ffffff" : "#752d2d";
  ctx.lineWidth = isPlayer ? 3 : 2;
  ctx.stroke();

  if (isPlayer) {

    ctx.fillStyle = "white";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
      "YOU",
      character.x,
      character.y-23
    );

  }

}

// ==========================================
// DRAW MINIMAP
// ==========================================

function drawMinimap() {

  const size = 150;
  const x = canvas.width-size-18;
  const y = canvas.height-size-18;

  ctx.fillStyle = "rgba(12,20,25,0.85)";
  ctx.fillRect(x-6,y-6,size+12,size+12);

  ctx.fillStyle = "#568d49";
  ctx.fillRect(x,y,size,size);

  const scaleX = size/world.width;
  const scaleY = size/world.height;

  for (const poi of pois) {

    ctx.fillStyle = "#e5d6a2";

    ctx.fillRect(
      x+poi.x*scaleX-2,
      y+poi.y*scaleY-2,
      5,5
    );

  }

  for (const bot of bots) {

    if (!bot.alive) continue;

    ctx.fillStyle = "#f15b55";

    ctx.fillRect(
      x+bot.x*scaleX,
      y+bot.y*scaleY,
      2,2
    );

  }

  ctx.fillStyle = "#39b8ff";

  ctx.beginPath();
  ctx.arc(
    x+player.x*scaleX,
    y+player.y*scaleY,
    4,0,Math.PI*2
  );
  ctx.fill();

}

// ==========================================
// RENDER
// ==========================================

function render() {

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();

  ctx.translate(-camera.x,-camera.y);

  drawWorld();

  for (const bot of bots) {

    if (bot.alive) {
      drawCharacter(bot);
    }

  }

  drawCharacter(player,true);

  ctx.restore();

  drawMinimap();

}

// ==========================================
// LOCATION DISPLAY
// ==========================================

function updateLocation() {

  let nearest = "Island";
  let nearestDistance = Infinity;

  for (const poi of pois) {

    const distance = Math.hypot(
      player.x-poi.x,
      player.y-poi.y
    );

    if (distance < nearestDistance) {

      nearestDistance = distance;
      nearest = poi.name;

    }

  }

  document.getElementById("poi").textContent =
    nearestDistance < 230 ? nearest : "Island";

}

// ==========================================
// GAME LOOP
// ==========================================

let lastTime = performance.now();

function gameLoop(now) {

  let dt = (now-lastTime)/1000;

  lastTime = now;

  dt = Math.min(dt,0.05);

  updatePlayer(dt);
  updateBots(dt);
  updateCamera();

  render();

  updateLocation();

  requestAnimationFrame(gameLoop);

}

// START GAME

document.getElementById("status").textContent =
  "49 AI bots deployed. Good luck!";

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
