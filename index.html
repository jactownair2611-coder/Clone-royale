
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Royale</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #101820;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 5;
  background: rgba(12,20,25,.85);
  padding: 14px 18px;
  border: 1px solid #52636a;
  border-radius: 10px;
  min-width: 190px;
}

#hud h2 {
  margin: 0 0 10px;
  color: #71e69a;
}

.stat {
  margin: 6px 0;
  font-size: 14px;
}

#controls {
  position: fixed;
  bottom: 15px;
  left: 15px;
  background: rgba(12,20,25,.8);
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
}

#location {
  position: fixed;
  top: 15px;
  right: 15px;
  background: rgba(12,20,25,.85);
  padding: 12px 18px;
  border-radius: 8px;
}

#status {
  position: fixed;
  top: 85px;
  right: 15px;
  background: rgba(12,20,25,.85);
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
}
</style>
</head>

<body>

<div id="hud">
  <h2>ULTIMATE ROYALE</h2>
  <div class="stat">Players: <span id="players">50</span>/50</div>
  <div class="stat">Mode: Solo</div>
  <div class="stat">Health: <span id="health">100</span></div>
  <div class="stat">Shield: 0</div>
  <div class="stat">Eliminations: 0</div>
  <div class="stat">Version: 0.1</div>
</div>

<div id="location">Location: <span id="poi">Island</span></div>

<div id="status">Match initializing...</div>

<div id="controls">
  <b>CONTROLS</b><br>
  W A S D - Move<br>
  SHIFT - Sprint
</div>

<canvas id="game"></canvas>

<script type="module" src="./js/main.js"></script>
</body>
</html>
